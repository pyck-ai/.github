name: badges
run-name: Badges in sync

# The SVG badges and gallery under badges/ are generated by
# scripts/generate-badges. This job fails if a badge was edited directly, or if
# a generator change was not re-synced with `task generate`.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: self-hosted-kata
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify badges are in sync
        run: task ci
