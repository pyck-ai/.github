name: ci

# The SVG badges and gallery under badges/ are generated by
# scripts/generate-badges. `task ci` fails if a badge was edited directly, or if
# a generator change was not re-synced with `task generate`.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    runs-on: self-hosted-kata
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify badges are in sync
        run: task ci
  ci-success:
    needs: [ci]
    if: always()
    runs-on: self-hosted-kata
    permissions: {}
    steps:
      - uses: pyck-ai/github-actions/gate@04c6f5cd724c6c65a2c2a613f4a97111bbf6347f # main 2026-10-15
        with:
          needs: ${{ toJSON(needs) }}
