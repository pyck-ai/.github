name: renovate
run-name: Renovate (org)

# Central, org-wide Renovate runner. Credentials live only in this repo's
# "renovate" environment; code repos hold no Renovate credentials or workflow.
# A repo opts in by (1) having the Renovate GitHub App installed on it and
# (2) committing a Renovate config. With onboarding off and require-config on,
# repos without a config are skipped silently.
#
# `discover` lists every repo the App can see; `renovate` fans out over them,
# one repo per job, four at a time. Each job mints its own repo-scoped token,
# so a fresh ~1h window covers every repo and one failure can't block the rest.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional regex on owner/repo, e.g. baseimages'
        required: false

# Never run two org sweeps at once; let an in-flight run finish.
concurrency:
  group: renovate-org
  cancel-in-progress: false

# Jobs authenticate via the App installation token, not GITHUB_TOKEN.
permissions: {}

jobs:
  discover:
    runs-on: self-hosted
    environment: renovate
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: List installation repositories
        id: list
        # Use github-script (runs on the runner's Node) so discovery needs no
        # gh/jq on the runner. Emit {name, full} per repo so the matrix can both
        # scope the token (name, owner-less) and target Renovate (full owner/name).
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const repos = await github.paginate(
              github.rest.apps.listReposAccessibleToInstallation,
              { per_page: 100 },
            );
            let list = repos.map((r) => ({ name: r.name, full: r.full_name }));
            const filter = process.env.FILTER;
            if (filter) {
              const re = new RegExp(filter);
              list = list.filter((r) => re.test(r.full));
            }
            core.setOutput('repos', JSON.stringify(list));
        env:
          FILTER: ${{ github.event.inputs.filter }}

  renovate:
    needs: discover
    # Skip cleanly when nothing matched (an empty matrix would error).
    if: needs.discover.outputs.repos != '[]'
    runs-on: self-hosted
    environment: renovate
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Mint token for ${{ matrix.repo.full }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo.name }}

      - name: Run Renovate on ${{ matrix.repo.full }}
        uses: renovatebot/github-action@83ec54fee49ab67d9cd201084c1ff325b4b462e4 # v46.1.10
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ matrix.repo.full }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          LOG_LEVEL: 'debug'
