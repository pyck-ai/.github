name: renovate
run-name: Renovate (org)

# Central, org-wide Renovate runner. Credentials live only in this repo's
# "renovate" environment; code repos hold no Renovate credentials or workflow.
# A repo opts in by (1) having the Renovate GitHub App installed on it and
# (2) committing a Renovate config. With onboarding off and require-config on,
# repos without a config are skipped silently.
#
# `discover` lists every repo the App can see; `renovate` fans out over them,
# one repo per job, four at a time. Each job mints its own repo-scoped token,
# so a fresh ~1h window covers every repo and one failure can't block the rest.
on:
  schedule:
    # Hourly at :30, not :00. GitHub's scheduler is best-effort and most
    # congested at the top of the hour, where runs are routinely delayed or
    # dropped; running 30 minutes past the hour lands more reliably. (Sub-hour
    # intervals like */15 are throttled hard and effectively don't fire, which
    # is why this is hourly rather than every 15 minutes.)
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional regex on owner/repo, e.g. baseimages'
        required: false

# No concurrency group: GitHub concurrency can only queue or cancel a run,
# never skip it. The `guard` job below makes a freshly scheduled run bail when
# an earlier run is still in progress, so overlapping runs never pile up.
permissions: {}

jobs:
  # If an earlier run of this workflow is still in progress, skip this one
  # instead of queueing behind it.
  guard:
    runs-on: self-hosted
    permissions:
      actions: read # list this workflow's runs
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'renovate.yml',
              status: 'in_progress',
              per_page: 100,
            });
            // Run ids increase over time, so a smaller id means an earlier run.
            const proceed = !runs.some((r) => r.id < context.runId);
            if (!proceed) {
              core.notice('An earlier Renovate run is still in progress; skipping.');
            }
            core.setOutput('proceed', proceed ? 'true' : 'false');

  discover:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: self-hosted
    environment: renovate
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_SECRET }}
          owner: ${{ github.repository_owner }}

      - name: List installation repositories
        id: list
        # Use github-script (runs on the runner's Node) so discovery needs no
        # gh/jq on the runner. Emit {name, full} per repo so the matrix can both
        # scope the token (name, owner-less) and target Renovate (full owner/name).
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const repos = await github.paginate(
              github.rest.apps.listReposAccessibleToInstallation,
              { per_page: 100 },
            );
            let list = repos.map((r) => ({ name: r.name, full: r.full_name }));
            const filter = process.env.FILTER;
            if (filter) {
              const re = new RegExp(filter);
              list = list.filter((r) => re.test(r.full));
            }
            core.setOutput('repos', JSON.stringify(list));
        env:
          FILTER: ${{ github.event.inputs.filter }}

  renovate:
    needs: discover
    # Skip cleanly when nothing matched (an empty matrix would error).
    if: needs.discover.outputs.repos != '[]'
    runs-on: self-hosted
    environment: renovate
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    steps:
      - name: Mint token for ${{ matrix.repo.full }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo.name }}

      - name: Run Renovate on ${{ matrix.repo.full }}
        uses: renovatebot/github-action@83ec54fee49ab67d9cd201084c1ff325b4b462e4 # v46.1.10
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ matrix.repo.full }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Allowlist for repo postUpgradeTasks (self-hosted admin config). A repo
          # opts into post-upgrade work by committing this exact hook path; the
          # pattern is fixed so onboarding a repo never requires editing this
          # workflow. Guard the path in each repo via CODEOWNERS.
          RENOVATE_ALLOWED_COMMANDS: '["^\\./\\.github/renovate-post-upgrade\\.sh$"]'
          # Footer on every repo's Dependency Dashboard, pointing back to this
          # central runner so maintainers know where their updates come from.
          RENOVATE_DEPENDENCY_DASHBOARD_FOOTER: |2

            ---
            🤖 Dependencies in this repository are updated by the org-wide
            [Renovate runner](https://github.com/pyck-ai/.github/actions/workflows/renovate.yml),
            defined in [`pyck-ai/.github`](https://github.com/pyck-ai/.github/blob/HEAD/.github/workflows/renovate.yml).
          LOG_LEVEL: 'debug'
