version: '3'

tasks:
  generate:
    desc: Regenerate the badges and their gallery under badges/ (downloads Mona Sans once, cached)
    cmds:
      - go run ./scripts/generate-badges

  ci:
    desc: Check that everything is in order; fails if a badge is out of sync with its generator (CI runs this)
    cmds:
      - go run ./scripts/generate-badges --check
